<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박지현 | 바이브코딩 풀스택 개발자 웹 명함</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Pretendard Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 화사한 오로라 파스텔 블롭 애니메이션 -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <main class="card-container">
    <div class="card" id="businessCard">
      <!-- 카드 상단 바 -->
      <div class="card-top-bar">
        <span class="status-badge">
          <span class="status-dot"></span>
          상큼한 에너지로 코딩 중 ✨
        </span>
        <button id="themeToggle" class="theme-btn" title="다크/라이트 모드 전환" aria-label="테마 전환">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>

      <!-- 아바타 / 캐릭터 영역 (안경 없는 맑고 화사한 미소 캐릭터) -->
      <div class="avatar-wrapper" id="avatarWrapper" title="클릭해서 인사해보세요!">
        <div class="avatar-glow"></div>
        <div class="avatar-speech" id="avatarSpeech">반가워요! 활기찬 하루 보내세요 💖</div>

        <!-- 고품질 여성 개발자 벡터 캐릭터 SVG (안경 미착용, 밝은 미소) -->
        <svg class="character-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- 맑고 뽀얀 피부 그라디언트 -->
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFF3EC" />
              <stop offset="100%" stop-color="#FCD9CC" />
            </linearGradient>
            <!-- 부드럽고 따뜻한 소프트 브라운 헤어 -->
            <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4E3629" />
              <stop offset="100%" stop-color="#312219" />
            </linearGradient>
            <!-- 화사한 코랄 핑크 & 피치 후드티 -->
            <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF758C" />
              <stop offset="100%" stop-color="#FF7EB3" />
            </linearGradient>
            <!-- 따스한 샴페인 파스텔 배경 원 -->
            <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF8F0" />
              <stop offset="50%" stop-color="#FFEBE5" />
              <stop offset="100%" stop-color="#FEE2E2" />
            </linearGradient>
            <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
            </filter>
          </defs>

          <!-- 배경 원 -->
          <circle cx="100" cy="100" r="95" fill="url(#bgCircle)" />

          <!-- 뒷머리 -->
          <path d="M48 100 C43 130 52 172 65 186 C85 192 115 192 135 186 C148 172 157 130 152 100 C152 58 142 36 100 36 C58 36 48 58 48 100 Z" fill="url(#hairGrad)" />

          <!-- 목 -->
          <path d="M88 128 L88 152 C88 156 112 156 112 152 L112 128 Z" fill="#F5C6B5" />

          <!-- 옷 (화사한 파스텔 코랄 후드티) -->
          <path d="M38 195 C38 160 66 144 86 148 L100 160 L114 148 C134 144 162 160 162 195 Z"
            fill="url(#hoodieGrad)" />
          <!-- 후드 끈 -->
          <path d="M92 159 L90 180" stroke="#FFE4E6" stroke-width="2.5" stroke-linecap="round" />
          <path d="M108 159 L110 180" stroke="#FFE4E6" stroke-width="2.5" stroke-linecap="round" />
          <!-- 옷 깃 라인 -->
          <path d="M86 148 Q100 164 114 148" fill="none" stroke="#F43F5E" stroke-width="2.2" />

          <!-- 얼굴 윤곽 -->
          <path d="M68 90 C68 128 80 145 100 145 C120 145 132 128 132 90 C132 66 120 60 100 60 C80 60 68 66 68 90 Z"
            fill="url(#skinGrad)" filter="url(#softShadow)" />

          <!-- 귀 -->
          <circle cx="68" cy="98" r="7" fill="#FCD9CC" />
          <circle cx="132" cy="98" r="7" fill="#FCD9CC" />
          <!-- 귀걸이 (반짝이는 골드 미니 링) -->
          <circle cx="67" cy="103" r="2.8" fill="none" stroke="#F59E0B" stroke-width="1.4" />
          <circle cx="133" cy="103" r="2.8" fill="none" stroke="#F59E0B" stroke-width="1.4" />

          <!-- 부드러운 아치형 눈썹 -->
          <path d="M76 83 Q84 79 92 83" fill="none" stroke="#4E3629" stroke-width="2.2" stroke-linecap="round" />
          <path d="M108 83 Q116 79 124 83" fill="none" stroke="#4E3629" stroke-width="2.2" stroke-linecap="round" />

          <!-- 눈 (안경 없이 맑고 반짝이는 생기 있는 눈매) -->
          <g class="character-eyes">
            <!-- 왼쪽 눈 -->
          <g class="eye-left-group">
            <!-- 속눈썹 라인 -->
            <path d="M77 93 Q84 89 91 93" fill="none" stroke="#261A15" stroke-width="2" stroke-linecap="round" />
            <!-- 눈동자 -->
            <ellipse class="eye-left" cx="84" cy="96" rx="5" ry="6.2" fill="#2A1B14" />
            <!-- 하이라이트 빛망울 -->
            <circle cx="82.5" cy="94" r="2.2" fill="#FFFFFF" />
            <circle cx="86" cy="98" r="1.1" fill="#FFFFFF" opacity="0.85" />
          </g>

            <!-- 오른쪽 눈 (윙크 인터랙션 대상) -->
            <g class="eye-right-group">
              <!-- 속눈썹 라인 -->
              <path d="M109 93 Q116 89 123 93" fill="none" stroke="#261A15" stroke-width="2" stroke-linecap="round" />
              <!-- 눈동자 -->
              <ellipse class="eye-right" cx="116" cy="96" rx="5" ry="6.2" fill="#2A1B14" />
              <!-- 하이라이트 빛망울 -->
              <circle cx="114.5" cy="94" r="2.2" fill="#FFFFFF" />
              <circle cx="118" cy="98" r="1.1" fill="#FFFFFF" opacity="0.85" />
            </g>
          </g>

          <!-- 상큼한 복숭아빛 볼터치 (홍조) -->
          <ellipse cx="75" cy="106" rx="6.5" ry="4" fill="#FF6B8B" opacity="0.4" />
          <ellipse cx="125" cy="106" rx="6.5" ry="4" fill="#FF6B8B" opacity="0.4" />
          <!-- 볼터치 반짝임 효과 -->
          <circle cx="73" cy="105" r="1.2" fill="#FFFFFF" opacity="0.7" />
          <circle cx="127" cy="105" r="1.2" fill="#FFFFFF" opacity="0.7" />

          <!-- 귀여운 코 -->
          <path d="M99 98 Q100 103 103 102" fill="none" stroke="#E39D8B" stroke-width="1.6" stroke-linecap="round" />

          <!-- 밝고 환한 미소 (활짝 웃는 입) -->
          <path class="character-mouth" d="M93 113 Q100 125 107 113 Q100 117 93 113 Z" fill="#E11D48" />

          <!-- 앞머리 & 자연스러운 헤어 스타일링 -->
          <path d="M66 82 C67 58 82 43 100 43 C118 43 133 58 134 82 C127 70 117 66 100 66 C83 66 73 70 66 82 Z" fill="url(#hairGrad)" />
          <!-- 왼쪽 잔머리 뱅 -->
          <path d="M67 78 C73 70 83 70 89 75 C83 83 74 91 67 95 Z" fill="url(#hairGrad)" />
          <!-- 오른쪽 잔머리 뱅 -->
          <path d="M133 78 C127 70 117 70 111 75 C117 83 126 91 133 95 Z" fill="url(#hairGrad)" />
          <!-- 자연스러운 이마 애교머리 포인트 -->
          <path d="M91 69 Q96 74 98 69" fill="none" stroke="url(#hairGrad)" stroke-width="2.8" stroke-linecap="round" />
        </svg>
      </div>

      <!-- 프로필 정보 영역 -->
      <div class="profile-info">
        <h1 class="profile-name">
          박지현 <span class="profile-en">Park Ji-hyun</span>
        </h1>
        <div class="role-tag">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>바이브코딩 풀스택 개발자</span>
        </div>
        <p class="tagline">
          “밝은 에너지와 직관적인 인터랙션으로 기분 좋은 웹 경험을 만듭니다.”
        </p>
      </div>

      <!-- 테크 스택 칩스 -->
      <div class="tech-stack">
        <span class="chip">✨ Full-Stack</span>
        <span class="chip">🎨 Vibe Coding</span>
        <span class="chip">⚛️ React</span>
        <span class="chip">🚀 Node.js</span>
        <span class="chip">💡 UI/UX</span>
      </div>

      <div class="divider"></div>

      <!-- 연락처 정보 리스트 -->
      <div class="contact-list">
        <!-- 이메일 -->
        <div class="contact-item" data-copy="pjh@weven.kr">
          <div class="icon-box email-icon">
            <i class="fa-solid fa-envelope"></i>
          </div>
          <div class="contact-details">
            <span class="label">이메일</span>
            <a href="mailto:pjh@weven.kr" class="value" title="이메일 보내기">pjh@weven.kr</a>
          </div>
          <button class="copy-btn" title="이메일 복사" aria-label="이메일 복사">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <!-- 전화번호 -->
        <div class="contact-item" data-copy="010-1234-5678">
          <div class="icon-box phone-icon">
            <i class="fa-solid fa-phone"></i>
          </div>
          <div class="contact-details">
            <span class="label">연락처</span>
            <a href="tel:01012345678" class="value" title="전화 걸기">010-1234-5678</a>
          </div>
          <button class="copy-btn" title="연락처 복사" aria-label="연락처 복사">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>

        <!-- 소속 / 웹사이트 -->
        <div class="contact-item" data-copy="weven.kr">
          <div class="icon-box org-icon">
            <i class="fa-solid fa-globe"></i>
          </div>
          <div class="contact-details">
            <span class="label">소속 도메인</span>
            <span class="value">weven.kr</span>
          </div>
          <button class="copy-btn" title="도메인 복사" aria-label="도메인 복사">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- 하단 액션 버튼 그룹 -->
      <div class="action-buttons">
        <button id="saveContactBtn" class="btn btn-primary">
          <i class="fa-solid fa-address-card"></i>
          <span>연락처 저장</span>
        </button>
        <button id="shareBtn" class="btn btn-secondary">
          <i class="fa-solid fa-share-nodes"></i>
          <span>명함 공유</span>
        </button>
      </div>

      <!-- 카드 하단 푸터 -->
      <footer class="card-footer">
        <span>© 2026 Park Ji-hyun • Crafted with Bright Vibes ☀️</span>
      </footer>
    </div>
  </main>

  <!-- 토스트 알림 메시지 -->
  <div id="toast" class="toast" role="alert" aria-live="assertive">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMessage">클립보드에 복사되었습니다!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
